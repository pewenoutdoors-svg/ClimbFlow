<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClimbFlow">
<meta name="theme-color" content="#080c12">
<title>ClimbFlow</title>
<link rel="manifest" href="#" id="manifest-link">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23080c12'/><text y='.9em' font-size='80' x='10'>⬆</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080c12;--bg2:#0f1520;--bg3:#161f30;--bg4:#1e2a3f;
  --g:#3ddc84;--g2:#2ab96a;--gd:#0d2419;
  --t:#dde6f5;--t2:#7e8fa8;--t3:#4a5872;--t4:#2e3c54;
  --b:#1a2538;--b2:#263347;--b3:#334460;
  --warn:#f0a500;--danger:#e8404a;--info:#4a9eff;--purple:#9b78f5;--teal:#2dd4bf;
  --r:14px;--rs:10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'DM Sans',sans-serif;color:var(--t);font-size:15px;line-height:1.5}
/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* ── TOPBAR ── */
.topbar{
  padding:calc(var(--safe-top) + 10px) 20px 10px;
  background:var(--bg2);
  border-bottom:1px solid var(--b);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  min-height:calc(var(--safe-top) + 54px);
}
.tb-logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--g);letter-spacing:.03em}
.tb-right{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;flex-shrink:0}
/* ── SCROLL AREA ── */
.page-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.page-area::-webkit-scrollbar{display:none}
.page{display:none;padding:20px 16px 0;animation:fadeUp .2s ease}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* ── BOTTOM NAV ── */
.bottom-nav{
  display:flex;background:var(--bg2);border-top:1px solid var(--b);
  padding-bottom:calc(var(--safe-bottom) + 4px);
  flex-shrink:0;
}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 6px;cursor:pointer;color:var(--t4);transition:.15s;border-top:2px solid transparent;position:relative}
.bn-item.on{color:var(--g);border-top-color:var(--g)}
.bn-item i{font-size:22px}
.bn-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeUp .3s ease;
}
.login-inner{width:100%;max-width:380px}
.login-logo{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:var(--g);letter-spacing:.02em;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:40px}
.login-card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:24px}
.login-mode-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--rs);padding:3px;margin-bottom:20px}
.lmt{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--t3);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.lmt.on{background:var(--g);color:#080c12}
lbl{display:block;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.field{margin-bottom:14px}
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rs);padding:13px 14px;color:var(--t);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:.15s}
.inp:focus{border-color:var(--g2);background:var(--bg4)}
.err{font-size:12px;color:var(--danger);text-align:center;margin-top:8px;min-height:18px}
/* ── BUTTONS ── */
.btn{padding:13px 20px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%}
.bp{background:var(--g);color:#080c12}.bp:active{background:var(--g2)}
.bg_{background:var(--bg3);color:var(--t2);border:1.5px solid var(--b2)}.bg_:active{background:var(--bg4)}
.bd{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-sm{padding:9px 16px;font-size:13px;width:auto;border-radius:8px}
.btn-xs{padding:6px 12px;font-size:12px;width:auto;border-radius:7px}
/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-sm{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px}
/* ── SECTION HEADER ── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--t)}
.sh-sub{font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-weight:600}
/* ── TAGS ── */
.tag{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;display:inline-block;white-space:nowrap}
.t-wu{background:#122030;color:var(--info)}.t-main{background:var(--gd);color:var(--g)}.t-cd{background:#1e1a08;color:var(--warn)}
.t-core{background:#1a0e2e;color:var(--purple)}.t-ant{background:#0d2020;color:var(--teal)}.t-finger{background:#200e0e;color:var(--danger)}
.t-strength{background:#0e1a2e;color:var(--info)}.t-cardio{background:#0e200e;color:var(--g)}.t-mob{background:#201a0e;color:var(--warn)}
.t-tech{background:#200e18;color:#f472b6}.t-power{background:#1a0e0e;color:#fb923c}.t-end{background:#0a1f10;color:#4ade80}
/* ── TODAY ── */
.session-hero{background:linear-gradient(135deg,#0a1f18 0%,var(--bg3) 100%);border:1px solid var(--g2);border-radius:var(--r);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.session-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:var(--g);opacity:.04;border-radius:50%}
.hero-label{font-size:11px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.hero-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--t);line-height:1.2;margin-bottom:4px}
.hero-sub{font-size:12px;color:var(--t3);margin-bottom:14px}
.coach-note{background:rgba(61,220,132,.07);border-left:3px solid var(--g);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:var(--t2);margin-bottom:14px;display:flex;gap:8px}
.phase-section{margin-bottom:16px}
.phase-title{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--b)}
.ex-item{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.ex-name{font-size:14px;font-weight:500;color:var(--t);margin-bottom:6px}
.params-row{display:flex;flex-wrap:wrap;gap:5px}
.param-chip{background:var(--bg4);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--t3)}
.param-chip b{color:var(--t)}
/* ── UPCOMING ── */
.up-item{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;transition:.1s}
.up-item:active{background:var(--bg3)}
.up-name{font-size:14px;font-weight:600;color:var(--t);margin-bottom:2px}
.up-date{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace}
/* ── PROGRAM ── */
.prog-item{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:8px;transition:.1s;cursor:pointer}
.prog-item.today-item{border-color:var(--g);background:rgba(13,36,25,.4)}
.prog-item.past-item{opacity:.5}
.prog-item-head{display:flex;justify-content:space-between;align-items:center}
.prog-name{font-size:14px;font-weight:600;color:var(--t)}
.prog-date{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace}
.prog-block{font-size:12px;color:var(--t3);margin-top:2px}
.prog-detail{margin-top:12px;border-top:1px solid var(--b);padding-top:12px}
/* ── LOG FORM ── */
.form-section{margin-bottom:20px}
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rpe-btn{padding:11px 4px;border:1.5px solid var(--b2);background:var(--bg3);color:var(--t3);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Mono',monospace;transition:.1s;text-align:center}
.rpe-btn:active{transform:scale(.95)}
.rpe-btn.on{background:var(--g);color:#080c12;border-color:var(--g)}
.dur-row{display:flex;gap:8px;align-items:center}
.dur-btn{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--b2);color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.1s}
.dur-btn:active{background:var(--bg4)}
.dur-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--t);text-align:center;flex:1}
.dur-label{font-size:11px;color:var(--t4);text-align:center;margin-top:2px}
/* ── PROGRESS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg3);border-radius:12px;padding:16px 14px;text-align:center}
.stat-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--g);margin-bottom:2px}
.stat-label{font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--b)}
.log-row:last-child{border-bottom:none}
.log-type{font-size:13px;font-weight:500;color:var(--t)}
.log-meta{font-size:11px;color:var(--t3);margin-top:1px}
.log-rpe{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal-overlay.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:0 0 calc(var(--safe-bottom) + 20px);width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--b3);border-radius:2px;margin:12px auto 0}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--t);padding:16px 20px 0}
.modal-body{padding:16px 20px}
/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-bottom) + 76px);left:50%;transform:translateX(-50%);background:var(--g);color:#080c12;padding:10px 20px;border-radius:24px;font-weight:700;font-size:13px;font-family:'Syne',sans-serif;z-index:300;white-space:nowrap;display:none;animation:fadeUp .2s ease}
/* ── UTILS ── */
.flex{display:flex}.gap{gap:8px}.ac{align-items:center}.jsb{justify-content:space-between}
.mt{margin-top:12px}.mb{margin-bottom:10px}
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:14px}
.empty i{font-size:40px;display:block;margin-bottom:10px;color:var(--t4)}
.text-g{color:var(--g)}.text-warn{color:var(--warn)}.text-danger{color:var(--danger)}
/* ── PWA INSTALL BANNER ── */
.install-banner{background:linear-gradient(135deg,#0d2419,#122030);border:1px solid var(--g2);border-radius:var(--r);padding:14px 16px;margin:0 16px 16px;display:none;align-items:center;gap:12px}
.install-banner.show{display:flex}
.install-icon{font-size:28px;flex-shrink:0}
.install-text{flex:1}
.install-text strong{font-family:'Syne',sans-serif;font-size:13px;color:var(--t);display:block}
.install-text span{font-size:11px;color:var(--t3)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div id="login-screen">
  <div class="login-inner">
    <div class="login-logo">⬆ ClimbFlow</div>
    <div class="login-sub">Training platform</div>
    <div class="login-card">
      <div class="login-mode-tabs">
        <button class="lmt on" id="lmt-login" onclick="setLoginMode('login')">Sign in</button>
        <button class="lmt" id="lmt-register" onclick="setLoginMode('register')">Register</button>
      </div>
      <div id="login-fields">
        <div class="field"><lbl>Email</lbl><input class="inp" type="email" id="l-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
        <button class="btn bp" onclick="doLogin()"><i class="ti ti-arrow-right"></i> Continue</button>
      </div>
      <div id="register-fields" style="display:none">
        <div class="field"><lbl>Your name</lbl><input class="inp" type="text" id="r-name" placeholder="e.g. Sarah"></div>
        <div class="field"><lbl>Email</lbl><input class="inp" type="email" id="r-email" placeholder="your@email.com"></div>
        <div class="field"><lbl>Current grade</lbl><input class="inp" type="text" id="r-grade" placeholder="e.g. 6b+"></div>
        <div class="field"><lbl>Goal grade</lbl><input class="inp" type="text" id="r-target" placeholder="e.g. 7a"></div>
        <button class="btn bp" onclick="doRegister()"><i class="ti ti-user-plus"></i> Create account</button>
      </div>
      <div class="err" id="auth-err"></div>
      <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--t4)">Demo: tabitha@climbflow.com</div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <span class="tb-logo">⬆ ClimbFlow</span>
    <div class="tb-right">
      <div class="avatar" id="uav"></div>
      <button onclick="logout()" style="background:none;border:none;color:var(--t4);cursor:pointer;padding:4px"><i class="ti ti-logout" style="font-size:18px"></i></button>
    </div>
  </div>

  <div class="install-banner" id="install-banner">
    <div class="install-icon">📲</div>
    <div class="install-text">
      <strong>Add to home screen</strong>
      <span>Install for quick access, like a native app</span>
    </div>
    <button class="btn-xs bp" id="install-btn" onclick="installPWA()">Install</button>
    <button onclick="document.getElementById('install-banner').classList.remove('show')" style="background:none;border:none;color:var(--t4);cursor:pointer;padding:4px;flex-shrink:0"><i class="ti ti-x"></i></button>
  </div>

  <div class="page-area">
    <div class="page on" id="pg-today"></div>
    <div class="page" id="pg-program"></div>
    <div class="page" id="pg-log"></div>
    <div class="page" id="pg-progress"></div>
  </div>

  <nav class="bottom-nav">
    <div class="bn-item on" id="bn-today" onclick="navTo('today')">
      <i class="ti ti-bolt"></i><span class="bn-label">Today</span>
    </div>
    <div class="bn-item" id="bn-program" onclick="navTo('program')">
      <i class="ti ti-calendar"></i><span class="bn-label">Program</span>
    </div>
    <div class="bn-item" id="bn-log" onclick="navTo('log')">
      <i class="ti ti-pencil"></i><span class="bn-label">Log</span>
    </div>
    <div class="bn-item" id="bn-progress" onclick="navTo('progress')">
      <i class="ti ti-chart-line"></i><span class="bn-label">Progress</span>
    </div>
  </nav>
</div>

<!-- QUICK LOG MODAL -->
<div class="modal-overlay" id="ql-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="ql-title">Log session</div>
    <div class="modal-body">
      <div style="margin-bottom:20px">
        <div class="sh-sub">Duration</div>
        <div class="dur-row">
          <div class="dur-btn" onclick="adjustDur(-5)">−</div>
          <div><div class="dur-val" id="ql-dur-val">60</div><div class="dur-label">minutes</div></div>
          <div class="dur-btn" onclick="adjustDur(5)">+</div>
        </div>
      </div>
      <div style="margin-bottom:20px">
        <div class="sh-sub" style="margin-bottom:8px">How hard? (RPE)</div>
        <div class="rpe-grid" id="ql-rpe-grid"></div>
        <input type="hidden" id="ql-rpe" value="0">
      </div>
      <div style="margin-bottom:20px">
        <div class="sh-sub" style="margin-bottom:8px">Fatigue</div>
        <div class="rpe-grid" id="ql-fat-grid"></div>
        <input type="hidden" id="ql-fat" value="0">
      </div>
      <div style="margin-bottom:20px">
        <lbl>Grade (best send)</lbl>
        <input class="inp" type="text" id="ql-grade" placeholder="e.g. 6b+">
      </div>
      <div style="margin-bottom:20px">
        <lbl>Notes</lbl>
        <textarea class="inp" id="ql-notes" rows="3" placeholder="How did it feel?" style="resize:none"></textarea>
      </div>
      <div class="flex gap">
        <button class="btn bp" onclick="submitQuickLog()"><i class="ti ti-check"></i> Save</button>
        <button class="btn bg_" onclick="closeModal()" style="width:auto;padding:13px 18px"><i class="ti ti-x"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
// EXERCISE DB (shared with coach)

function setLoginMode(m){
  loginMode=m;
  document.getElementById('lmt-login').classList.toggle('on',m==='login');
  document.getElementById('lmt-register').classList.toggle('on',m==='register');
  document.getElementById('login-fields').style.display=m==='login'?'block':'none';
  document.getElementById('register-fields').style.display=m==='register'?'block':'none';
  document.getElementById('auth-err').textContent='';
}

async function doLogin(){
  const email=document.getElementById('l-email').value.trim().toLowerCase();
  const err=document.getElementById('auth-err');
  if(!email){err.textContent='Enter your email';return;}
  // Check local user registry
  let registry={};
  try{const r=await window.storage.get('cf4-mobile-users');if(r)registry=JSON.parse(r.value);}catch(e){}
  // Demo account
  if(email==='tabitha@climbflow.com'){
    loginAs({name:'Tabitha',email,clientId:'tabitha',grade:'6c',target:'7a',goal:'Outdoor 7a'});
    return;
  }
  if(registry[email]){loginAs(registry[email]);return;}
  err.textContent='Account not found. Register below.';
}

async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim().toLowerCase();
  const grade=document.getElementById('r-grade').value.trim();
  const target=document.getElementById('r-target').value.trim();
  const err=document.getElementById('auth-err');
  if(!name||!email){err.textContent='Enter name and email';return;}
  if(!email.includes('@')){err.textContent='Enter a valid email';return;}
  // Save to local registry
  let registry={};
  try{const r=await window.storage.get('cf4-mobile-users');if(r)registry=JSON.parse(r.value);}catch(e){}
  if(registry[email]){err.textContent='Email already registered. Sign in instead.';return;}
  const clientId='client-'+Date.now();
  const user={name,email,clientId,grade,target,goal:''};
  registry[email]=user;
  try{await window.storage.set('cf4-mobile-users',JSON.stringify(registry));}catch(e){}
  // Also register in coach clients list
  try{
    const r=await window.storage.get('cf4-clients');
    const clients=r?JSON.parse(r.value):[];
    if(!clients.find(c=>c.email===email)){
      clients.push({id:clientId,name,email,grade,target,goal:''});
      await window.storage.set('cf4-clients',JSON.stringify(clients));
    }
  }catch(e){}
  loginAs(user);
  toast('Welcome, '+name+'! 🧗');
}

function loginAs(user){
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  const av=document.getElementById('uav');
  av.textContent=user.name[0];
  av.style.background='#0d1d33';av.style.color='var(--info)';
  loadData().then(()=>renderPage('today'));
  checkInstallBanner();
}

function logout(){
  currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('l-email').value='';
  document.getElementById('auth-err').textContent='';
}

function navTo(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+page).classList.add('on');
  document.getElementById('bn-'+page).classList.add('on');
  // Scroll to top
  document.querySelector('.page-area').scrollTop=0;
  renderPage(page);
}

function renderPage(page){
  if(page==='today') renderToday();
  else if(page==='program') renderProgram();
  else if(page==='log') renderLog();
  else if(page==='progress') renderProgress();
}

function dsToday(){return new Date().toFullYear?new Date().toISOString().slice(0,10):new Date().toISOString().slice(0,10);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(ds){
  const d=new Date(ds+'T12:00:00');
  return d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
}
function getMyAssigned(){
  const myId=currentUser.clientId;
  return calAssigned.filter(a=>(a.client===myId||a.client==='')).sort((a,b)=>a.date.localeCompare(b.date));
}
function getSessionInfo(entry){
  if(entry.sType==='template'&&entry.tplId){
    const tpl=templates.find(t=>t.id===entry.tplId);
    if(tpl){
      const wm=entry.label?.match(/W(\d+)/);
      const wn=wm?parseInt(wm[1]):1;
      let cum=0;
      for(const b of tpl.blocks){cum+=b.weeks;if(wn<=cum)return{block:b,exs:b.exercises||{warmup:[],main:[],cooldown:[]}};}
      const last=tpl.blocks[tpl.blocks.length-1];
      return{block:last,exs:last?.exercises||{warmup:[],main:[],cooldown:[]}};
    }
  }
  if(entry.sType==='custom'||entry.isCustom){
    const cs=customSessions.find(x=>entry.session?.includes(x.id));
    if(cs)return{block:null,exs:cs.exercises||{warmup:[],main:[],cooldown:[]}};
  }
  return null;
}
function renderPhase(title,tag,exs){
  if(!exs||!exs.length) return '';
  const tagCls=tag==='wu'?'t-wu':tag==='main'?'t-main':'t-cd';
  return `<div class="phase-section">
    <div class="phase-title"><span class="tag ${tagCls}">${title}</span></div>
    ${exs.map(ex=>`<div class="ex-item">
      <div class="ex-name">${ex.name}</div>
      <div class="params-row">${(ex.params||[]).filter(p=>p.v&&p.v!=='0').map(p=>`<span class="param-chip">${p.l}: <b>${p.v}${p.u?' '+p.u:''}</b></span>`).join('')}</div>
    </div>`).join('')}
  </div>`;
}

function renderToday(){
  const el=document.getElementById('pg-today');
  const todayStr=today();
  const upcoming=getMyAssigned().filter(a=>a.date>=todayStr);
  const next=upcoming[0];
  let html=`<div class="sh"><div class="sh-title">Today</div><div style="font-size:12px;color:var(--t3);font-family:'DM Mono',monospace">${fmtDate(todayStr)}</div></div>`;
  if(next){
    const info=getSessionInfo(next);
    const isRest=next.sType==='rest';
    html+=`<div class="session-hero">
      <div class="hero-label">${next.date===todayStr?'Today':'Next session'} · ${fmtDate(next.date)}</div>
      <div class="hero-name">${next.label||'Session'}</div>
      <div class="hero-sub">${info?.block?info.block.name:''}</div>
      ${next.note?`<div class="coach-note"><i class="ti ti-message-circle" style="color:var(--g);flex-shrink:0;margin-top:1px"></i><span>${next.note}</span></div>`:''}
      ${isRest?`<div style="text-align:center;padding:16px 0;color:var(--t3)"><i class="ti ti-zzz" style="font-size:32px;display:block;margin-bottom:8px"></i>Rest day — recover well</div>`:
        info?`${renderPhase('Warm-up','wu',info.exs.warmup)}${renderPhase('Main','main',info.exs.main)}${renderPhase('Cool-down','cd',info.exs.cooldown)}`:''}
      ${!isRest?`<button class="btn bp mt" onclick="openQuickLog('${next.id}','${(next.label||'Session').replace(/'/g,"\'")}','${next.date}')"><i class="ti ti-pencil"></i> Log this session</button>`:''}
    </div>`;
    const rest=upcoming.slice(1,5);
    if(rest.length){
      html+=`<div class="sh-sub">Upcoming</div>`;
      html+=rest.map(a=>{
        const isR=a.sType==='rest';
        return `<div class="up-item" onclick="${isR?'':` openQuickLog('${a.id}','${(a.label||'Session').replace(/'/g,"\'")}','${a.date}')`}">
          <div><div class="up-name">${a.label||'Session'}</div><div class="up-date">${fmtDate(a.date)}</div></div>
          ${isR?'<span class="tag t-cd">Rest</span>':`<button class="btn-xs bg_" style="border-color:var(--b2)">Log</button>`}
        </div>`;
      }).join('');
    }
  } else {
    html+=`<div class="empty"><i class="ti ti-calendar-off"></i>No upcoming sessions.<br><span style="font-size:13px">Your coach hasn't assigned a program yet.</span></div>`;
  }
  el.innerHTML=html;
}

// PROGRAM
// ════════════════════════════════════════════
let progOpen=null;
function renderProgram(){
  const el=document.getElementById('pg-program');
  const todayStr=today();
  const all=getMyAssigned();
  let html=`<div class="sh"><div class="sh-title">Program</div><span style="font-size:12px;color:var(--t3)">${all.length} sessions</span></div>`;
  if(!all.length){html+='<div class="empty"><i class="ti ti-calendar-off"></i>No program assigned yet.</div>';el.innerHTML=html;return;}
  all.forEach((a,i)=>{
    const isPast=a.date<todayStr, isTod=a.date===todayStr;
    const info=getSessionInfo(a);
    const isOpen=progOpen===i;
    html+=`<div class="prog-item${isTod?' today-item':isPast?' past-item':''}" onclick="toggleProg(${i})">
      <div class="prog-item-head">
        <div>
          <div class="prog-name">${a.label||'Session'}${isTod?' <span style="color:var(--g);font-size:11px">· today</span>':''}</div>
          ${info?.block?`<div class="prog-block">${info.block.name}</div>`:''}
        </div>
        <div style="text-align:right">
          <div class="prog-date">${fmtDate(a.date)}</div>
          <i class="ti ti-chevron-${isOpen?'up':'down'}" style="color:var(--t4);font-size:12px;margin-top:4px;display:block"></i>
        </div>
      </div>
      ${isOpen?`<div class="prog-detail">
        ${a.note?`<div class="coach-note" style="margin-bottom:12px"><i class="ti ti-message-circle" style="color:var(--g)"></i>${a.note}</div>`:''}
        ${a.sType!=='rest'&&info?`${renderPhase('Warm-up','wu',info.exs.warmup)}${renderPhase('Main','main',info.exs.main)}${renderPhase('Cool-down','cd',info.exs.cooldown)}`:''}
        ${a.sType==='rest'?'<p style="color:var(--t3);font-size:13px;text-align:center;padding:8px 0">Rest & recovery day</p>':''}
        ${a.sType!=='rest'?`<button class="btn bp" style="margin-top:8px" onclick="event.stopPropagation();openQuickLog('${a.id}','${(a.label||'Session').replace(/'/g,"\'")}','${a.date}')"><i class="ti ti-pencil"></i> Log this session</button>`:''}
      </div>`:''}
    </div>`;
  });
  el.innerHTML=html;
}
function toggleProg(i){progOpen=progOpen===i?null:i;renderProgram();}

function adjustLogDur(d){
  logState.dur=Math.max(15,logState.dur+d);

  if(el) el.textContent=logState.dur;
}
function buildRpeGrid(gridId,hidId,current){
  const grid=document.getElementById(gridId);if(!grid)return;
  grid.innerHTML='';
  for(let i=1;i<=10;i++){
    const b=document.createElement('button');
    b.className='rpe-btn'+(i===current?' on':'');
    b.textContent=i;
    b.type='button';
    const col=i>=9?'var(--danger)':i>=7?'var(--warn)':i>=5?'#a3e635':'var(--g)';
    b.onclick=()=>{
      grid.querySelectorAll('.rpe-btn').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.borderColor='';x.style.color='';});
      b.classList.add('on');b.style.background=col;b.style.borderColor=col;b.style.color='#080c12';
      document.getElementById(hidId).value=i;
    };
    if(i===current){b.style.background=col;b.style.borderColor=col;b.style.color='#080c12';}
    grid.appendChild(b);
  }
}
function submitLog(){
  const rpe=parseInt(document.getElementById('log-rpe').value)||0;
  const fat=parseInt(document.getElementById('log-fat').value)||0;
  const dur=logState.dur;
  const grade=document.getElementById('log-grade').value.trim();
  const focus=document.getElementById('log-focus').value.trim();
  const notes=document.getElementById('log-notes').value.trim();
  logs.push({
    id:Date.now(),client:currentUser.clientId,date:today(),
    type:logState.type,focus,dur,grade,rpe,fat,notes,load:rpe*dur
  });
  saveData();
  logState={type:'Training',focus:'',dur:60,rpe:0,fat:0,grade:'',sends:0,notes:''};
  toast('Session logged! 🎉');
  navTo('progress');
}

// ════════════════════════════════════════════
// PROGRESS
// ════════════════════════════════════════════
function renderProgress(){
  const el=document.getElementById('pg-progress');
  const ml=logs.filter(l=>l.client===currentUser.clientId);
  const totalMin=ml.reduce((a,l)=>a+(l.dur||0),0);
  const avgRpe=ml.filter(l=>l.rpe).reduce((a,l)=>a+l.rpe,0)/(ml.filter(l=>l.rpe).length||1);
  const loads=ml.map(l=>l.load||0);
  const maxLoad=Math.max(...loads,1);
  // Last 8 sessions for mini chart
  const recent=[...ml].reverse().slice(0,8).reverse();
  let html=`<div class="sh-title" style="margin-bottom:16px">Progress</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val">${ml.length}</div><div class="stat-label">Sessions</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--info)">${Math.round(totalMin/60)}h</div><div class="stat-label">Training time</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--warn)">${avgRpe.toFixed(1)}</div><div class="stat-label">Avg RPE</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--purple)">${ml.filter(l=>l.grade).length}</div><div class="stat-label">Grades logged</div></div>
  </div>`;
  if(recent.length){
    html+=`<div class="sh-sub" style="margin-bottom:8px">Load trend</div>
    <div style="display:flex;align-items:flex-end;gap:4px;height:56px;margin-bottom:20px;background:var(--bg3);border-radius:10px;padding:8px 10px">
      ${recent.map(l=>{
        const pct=Math.max(8,Math.round(((l.load||0)/maxLoad)*100));
        const col=(l.load||0)>maxLoad*.75?'var(--danger)':(l.load||0)>maxLoad*.4?'var(--warn)':'var(--g)';
        return `<div style="flex:1;height:${pct}%;background:${col};border-radius:3px 3px 0 0;min-height:4px" title="${l.date}"></div>`;
      }).join('')}
    </div>`;
  }
  html+=`<div class="sh-sub" style="margin-bottom:8px">Session history</div>`;
  if(!ml.length){html+='<div class="empty"><i class="ti ti-clipboard-list"></i>No sessions logged yet.</div>';}
  else{
    html+=`<div class="card" style="padding:0 16px">`;
    [...ml].reverse().slice(0,20).forEach(l=>{
      const rpeCol=l.rpe>=8?'var(--danger)':l.rpe>=6?'var(--warn)':'var(--g)';
      html+=`<div class="log-row">
        <div>
          <div class="log-type">${l.focus||l.type}</div>
          <div class="log-meta">${fmtDate(l.date)}${l.grade?' · '+l.grade:''}${l.dur?' · '+l.dur+'min':''}</div>
        </div>
        <div class="log-rpe" style="color:${rpeCol}">${l.rpe?'RPE '+l.rpe:'—'}</div>
      </div>`;
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

}

function installPWA(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(()=>{
    deferredInstallPrompt=null;
    document.getElementById('install-banner').classList.remove('show');
  });
}
// iOS install hint
function isIOS(){return/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;}
function isInStandaloneMode(){return window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;}
window.addEventListener('load',()=>{
  if(isIOS()&&!isInStandaloneMode()&&currentUser){
    // Show hint
    const b=document.getElementById('install-banner');

    b.querySelector('.install-text span').textContent='Tap Share → "Add to Home Screen"';

});
