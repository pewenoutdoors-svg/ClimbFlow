<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ClimbFlow - Training Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080c12;--bg2:#0f1520;--bg3:#161f30;--bg4:#1e2a3f;
  --g:#3ddc84;--g2:#2ab96a;--gd:#0d2419;
  --t:#dde6f5;--t2:#7e8fa8;--t3:#4a5872;--t4:#2e3c54;
  --b:#1a2538;--b2:#263347;--b3:#334460;
  --warn:#f0a500;--danger:#e8404a;--info:#4a9eff;--purple:#9b78f5;--teal:#2dd4bf;
  --r:14px;--rs:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);font-size:14px;min-height:100vh}
.screen{display:none}
.screen.on{display:block}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#app-screen{display:flex;flex-direction:column;height:100vh}
.login-box{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:28px;width:100%;max-width:380px}
.logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--g);margin-bottom:4px}
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--b2);border-radius:10px;padding:12px;color:var(--t);font-size:14px;margin:8px 0}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-size:14px}
.bp{background:var(--g);color:#080c12}
.bg_{background:var(--bg3);color:var(--t2);border:1px solid var(--b2)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.t-finger{background:#200e0e;color:var(--danger)}
.t-strength{background:#0e1a2e;color:var(--info)}
.t-endurance{background:#0a1f10;color:#4ade80}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--b)}
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--b);padding:16px 0;overflow-y:auto}
.ni{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--t3)}
.ni:hover{background:var(--bg3);color:var(--t)}
.ni.on{background:var(--gd);color:var(--g)}
.main-area{flex:1;padding:20px;overflow-y:auto}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px}
.flex{display:flex}.gap{gap:8px}.ac{align-items:center}.jsb{justify-content:space-between}.mt{margin-top:12px}.mb{margin-bottom:10px}
.empty{text-align:center;padding:40px;color:var(--t3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#080c12;padding:10px 20px;border-radius:24px;font-weight:600;display:none;z-index:200}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="login-screen" class="screen on">
  <div class="login-box">
    <div class="logo">⬆ ClimbFlow</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:30px">Climbing coaching platform</div>
    <input type="email" class="inp" id="login-email" placeholder="your@email.com">
    <button class="btn bp" onclick="doLogin()">Continue</button>
    <div id="login-error" style="color:var(--danger);margin-top:12px;text-align:center"></div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--b)">
      <div class="flex gap ac" style="justify-content:center">
        <span class="tag" style="cursor:pointer;background:var(--gd);color:var(--g)" onclick="quickLogin('agu@climbflow.com')">👨‍🏫 Coach: agu@climbflow.com</span>
        <span class="tag" style="cursor:pointer;background:#0d1d33;color:var(--info)" onclick="quickLogin('tabitha@climbflow.com')">🧗 Client: tabitha@climbflow.com</span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen">
  <div class="topbar">
    <span class="logo" style="font-size:18px">⬆ ClimbFlow</span>
    <div class="flex ac gap">
      <div class="avatar" id="user-avatar" style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700"></div>
      <button onclick="logout()" style="background:none;border:none;color:var(--t4);cursor:pointer"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div id="app-container" style="display:flex;flex:1;overflow:hidden"></div>
</div>

<script>
// ========== DATOS DE PRUEBA ==========
let currentUser = null;

const DEMO_USERS = {
  'agu@climbflow.com': { name: 'Agu', role: 'coach', color: '#3ddc84', bg: '#0d2419' },
  'tabitha@climbflow.com': { name: 'Tabitha', role: 'client', clientId: 'tabitha', color: '#4a9eff', bg: '#0d1d33' }
};

// Base de datos local (se guarda en localStorage)
let DB = {
  clients: [{ id: 'tabitha', name: 'Tabitha', email: 'tabitha@climbflow.com', target: '7a' }],
  templates: [
    { id: 't1', name: 'Max Hangs', type: 'finger', description: 'Maximum intensity finger strength' },
    { id: 't2', name: 'Repeaters 7:3', type: 'finger', description: 'Classic finger strength protocol' }
  ],
  sessions: [],
  assignments: [],
  logs: []
};

function loadData() {
  try {
    const saved = localStorage.getItem('climbflow_data');
    if (saved) {
      const data = JSON.parse(saved);
      DB.clients = data.clients || DB.clients;
      DB.templates = data.templates || DB.templates;
      DB.sessions = data.sessions || [];
      DB.assignments = data.assignments || [];
      DB.logs = data.logs || [];
    }
  } catch(e) {}
}

function saveData() {
  localStorage.setItem('climbflow_data', JSON.stringify(DB));
}

// ========== LOGIN ==========
function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const errorDiv = document.getElementById('login-error');
  
  if (DEMO_USERS[email]) {
    currentUser = DEMO_USERS[email];
    currentUser.email = email;
    loadData();
    document.getElementById('login-screen').classList.remove('on');
    document.getElementById('app-screen').classList.add('on');
    document.getElementById('user-avatar').textContent = currentUser.name[0];
    document.getElementById('user-avatar').style.background = currentUser.bg;
    document.getElementById('user-avatar').style.color = currentUser.color;
    renderApp();
    errorDiv.textContent = '';
  } else {
    errorDiv.textContent = 'Email no encontrado. Usa agu@climbflow.com o tabitha@climbflow.com';
  }
}

function quickLogin(email) {
  document.getElementById('login-email').value = email;
  doLogin();
}

function logout() {
  currentUser = null;
  document.getElementById('app-screen').classList.remove('on');
  document.getElementById('login-screen').classList.add('on');
}

// ========== RENDER PRINCIPAL ==========
function renderApp() {
  const container = document.getElementById('app-container');
  if (currentUser.role === 'coach') {
    renderCoachUI(container);
  } else {
    renderClientUI(container);
  }
}

// ========== COACH UI ==========
let activeTab = 'calendar';

function renderCoachUI(container) {
  container.innerHTML = `
    <div class="sidebar" id="coach-sidebar"></div>
    <div class="main-area" id="coach-main"></div>
  `;
  renderCoachSidebar();
  renderCoachView('calendar');
}

function renderCoachSidebar() {
  const sidebar = document.getElementById('coach-sidebar');
  sidebar.innerHTML = `
    <div class="ni ${activeTab === 'calendar' ? 'on' : ''}" onclick="switchView('calendar')"><i class="ti ti-calendar"></i> Calendar</div>
    <div class="ni ${activeTab === 'templates' ? 'on' : ''}" onclick="switchView('templates')"><i class="ti ti-template"></i> Templates</div>
    <div class="ni ${activeTab === 'sessions' ? 'on' : ''}" onclick="switchView('sessions')"><i class="ti ti-device-floppy"></i> Sessions</div>
    <div class="ni ${activeTab === 'clients' ? 'on' : ''}" onclick="switchView('clients')"><i class="ti ti-users"></i> Clients</div>
    <div class="ni ${activeTab === 'logs' ? 'on' : ''}" onclick="switchView('logs')"><i class="ti ti-table"></i> All Logs</div>
  `;
}

function switchView(view) {
  activeTab = view;
  renderCoachSidebar();
  renderCoachView(view);
}

window.switchView = switchView;

function renderCoachView(view) {
  const main = document.getElementById('coach-main');
  if (view === 'calendar') renderCalendar(main);
  else if (view === 'templates') renderTemplates(main);
  else if (view === 'sessions') renderSessions(main);
  else if (view === 'clients') renderClients(main);
  else if (view === 'logs') renderAllLogs(main);
}

function renderCalendar(container) {
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  
  let html = `<div class="flex jsb ac mb"><h3>${today.toLocaleString('default', { month: 'long' })} ${year}</h3><button class="btn bp" style="width:auto;padding:8px 16px" onclick="openAssignModal()">+ Add Session</button></div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px">${['S','M','T','W','T','F','S'].map(d => `<div style="text-align:center;font-size:11px;color:var(--t4)">${d}</div>`).join('')}</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">`;
  
  for (let i = 0; i < firstDay; i++) html += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayAssignments = DB.assignments.filter(a => a.date === dateStr);
    const isToday = d === today.getDate();
    html += `<div class="card" style="padding:8px;cursor:pointer;${isToday ? 'border-color:var(--g)' : ''}" onclick="openAssignModal('${dateStr}')">
      <div style="font-weight:600">${d}</div>
      ${dayAssignments.slice(0,2).map(a => `<div style="font-size:10px;color:var(--g);margin-top:2px">${a.sessionName}</div>`).join('')}
      ${dayAssignments.length > 2 ? `<div style="font-size:9px;color:var(--t4)">+${dayAssignments.length-2}</div>` : ''}
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

function renderTemplates(container) {
  let html = `<div class="flex jsb ac mb"><h3>Templates</h3><button class="btn bp" style="width:auto;padding:8px 16px" onclick="createTemplate()">+ New</button></div>`;
  DB.templates.forEach(t => {
    html += `<div class="card flex jsb ac">
      <div><strong>${t.name}</strong><br><span class="tag t-${t.type}">${t.type}</span></div>
      <button class="btn bg_" style="width:auto;padding:8px 16px" onclick="assignTemplate('${t.id}')">Assign</button>
    </div>`;
  });
  container.innerHTML = html;
}

function renderSessions(container) {
  let html = `<h3 class="mb">Saved Sessions</h3>`;
  if (!DB.sessions.length) html += `<div class="empty">No saved sessions. Create from calendar.</div>`;
  DB.sessions.forEach(s => {
    html += `<div class="card flex jsb ac">
      <div><strong>${s.name}</strong><br><span class="tag">${s.type || 'Custom'}</span></div>
      <button class="btn bg_" style="width:auto;padding:8px 16px" onclick="assignSession('${s.id}')">Assign</button>
    </div>`;
  });
  container.innerHTML = html;
}

function renderClients(container) {
  let html = `<div class="flex jsb ac mb"><h3>Clients</h3><button class="btn bp" style="width:auto;padding:8px 16px" onclick="openAddClientModal()">+ Add</button></div>`;
  DB.clients.forEach(c => {
    html += `<div class="card flex jsb ac">
      <div><strong>${c.name}</strong><br><span style="font-size:12px;color:var(--t3)">${c.email}</span></div>
      <div><span class="tag">Target: ${c.target || '—'}</span></div>
    </div>`;
  });
  container.innerHTML = html;
}

function renderAllLogs(container) {
  let html = `<h3 class="mb">All Training Logs</h3>`;
  if (!DB.logs.length) html += `<div class="empty">No logs yet</div>`;
  else {
    html += `<div class="card">`;
    [...DB.logs].reverse().forEach(l => {
      const client = DB.clients.find(c => c.id === l.clientId);
      html += `<div class="flex jsb" style="padding:8px 0;border-bottom:1px solid var(--b)"><span>${l.date}</span><span>${client?.name || l.clientId}</span><span>${l.focus || l.type}</span><span style="color:var(--g)">RPE: ${l.rpe || '—'}</span></div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}

// ========== CLIENT UI ==========
function renderClientUI(container) {
  container.innerHTML = `
    <div style="flex:1;overflow-y:auto;padding:20px" id="client-main"></div>
    <div style="display:flex;background:var(--bg2);border-top:1px solid var(--b);padding:8px 0">
      <div style="flex:1;text-align:center;padding:8px;cursor:pointer;color:${activeClientTab === 'today' ? 'var(--g)' : 'var(--t4)'}" onclick="switchClientTab('today')"><i class="ti ti-bolt" style="font-size:22px"></i><div style="font-size:10px">Today</div></div>
      <div style="flex:1;text-align:center;padding:8px;cursor:pointer;color:${activeClientTab === 'program' ? 'var(--g)' : 'var(--t4)'}" onclick="switchClientTab('program')"><i class="ti ti-calendar" style="font-size:22px"></i><div style="font-size:10px">Program</div></div>
      <div style="flex:1;text-align:center;padding:8px;cursor:pointer;color:${activeClientTab === 'log' ? 'var(--g)' : 'var(--t4)'}" onclick="switchClientTab('log')"><i class="ti ti-pencil" style="font-size:22px"></i><div style="font-size:10px">Log</div></div>
      <div style="flex:1;text-align:center;padding:8px;cursor:pointer;color:${activeClientTab === 'progress' ? 'var(--g)' : 'var(--t4)'}" onclick="switchClientTab('progress')"><i class="ti ti-chart-line" style="font-size:22px"></i><div style="font-size:10px">Progress</div></div>
    </div>
  `;
  renderClientView('today');
}

let activeClientTab = 'today';

function switchClientTab(tab) {
  activeClientTab = tab;
  renderClientView(tab);
}

window.switchClientTab = switchClientTab;

function renderClientView(tab) {
  const container = document.getElementById('client-main');
  if (tab === 'today') renderClientToday(container);
  else if (tab === 'program') renderClientProgram(container);
  else if (tab === 'log') renderClientLog(container);
  else if (tab === 'progress') renderClientProgress(container);
}

function renderClientToday(container) {
  const todayStr = new Date().toISOString().slice(0,10);
  const myAssignments = DB.assignments.filter(a => a.clientId === currentUser.clientId && a.date >= todayStr);
  const todaySession = myAssignments.find(a => a.date === todayStr);
  
  if (!todaySession) {
    container.innerHTML = `<div class="empty">🎉 No session for today! Rest day.</div>`;
    return;
  }
  
  container.innerHTML = `
    <div class="card" style="border-color:var(--g)">
      <div class="flex jsb ac"><span class="tag" style="background:var(--gd);color:var(--g)">Today</span><span>${todayStr}</span></div>
      <h3 style="margin:12px 0 4px">${todaySession.sessionName}</h3>
      ${todaySession.note ? `<div style="background:var(--gd);padding:10px;border-radius:8px;margin:12px 0;color:var(--g)">📝 ${todaySession.note}</div>` : ''}
      <button class="btn bp" style="margin-top:12px" onclick="openQuickLog('${todaySession.id}','${todaySession.sessionName}','${todayStr}')"><i class="ti ti-pencil"></i> Log this session</button>
    </div>
    ${myAssignments.length > 1 ? `<div class="mt"><strong>Upcoming</strong>${myAssignments.slice(1,4).map(a => `<div class="card" style="margin-top:8px"><strong>${a.sessionName}</strong><br><span style="font-size:11px;color:var(--t3)">${a.date}</span></div>`).join('')}</div>` : ''}
  `;
}

function renderClientProgram(container) {
  const myAssignments = DB.assignments.filter(a => a.clientId === currentUser.clientId).sort((a,b) => a.date.localeCompare(b.date));
  if (!myAssignments.length) {
    container.innerHTML = `<div class="empty">No sessions assigned yet</div>`;
    return;
  }
  container.innerHTML = `<h3 class="mb">My Program</h3>${myAssignments.map(a => `<div class="card"><div class="flex jsb"><strong>${a.sessionName}</strong><span style="font-size:12px;color:var(--t3)">${a.date}</span></div>${a.note ? `<div style="font-size:12px;color:var(--t2);margin-top:6px">📝 ${a.note}</div>` : ''}</div>`).join('')}`;
}

function renderClientLog(container) {
  container.innerHTML = `
    <h3 class="mb">Log a Session</h3>
    <div class="card">
      <div><lbl style="display:block;font-size:11px;color:var(--t3);margin-bottom:4px">Date</lbl><input class="inp" type="date" id="log-date" value="${new Date().toISOString().slice(0,10)}" style="margin-bottom:12px"></div>
      <div><lbl style="display:block;font-size:11px;color:var(--t3);margin-bottom:4px">Session</lbl><select class="inp" id="log-session" style="margin-bottom:12px"><option value="">Select...</option>${DB.assignments.filter(a => a.clientId === currentUser.clientId).map(a => `<option value="${a.id}">${a.sessionName} (${a.date})</option>`).join('')}</select></div>
      <div><lbl style="display:block;font-size:11px;color:var(--t3);margin-bottom:4px">RPE (1-10)</lbl><div class="flex gap" id="rpe-btns"></div><input type="hidden" id="log-rpe"></div>
      <div class="mt"><lbl style="display:block;font-size:11px;color:var(--t3);margin-bottom:4px">Duration (min)</lbl><input class="inp" type="number" id="log-dur" placeholder="60"></div>
      <div class="mt"><lbl style="display:block;font-size:11px;color:var(--t3);margin-bottom:4px">Notes</lbl><textarea class="inp" id="log-notes" rows="3"></textarea></div>
      <button class="btn bp mt" onclick="submitClientLog()">Save Log</button>
    </div>
  `;
  const rpeContainer = document.getElementById('rpe-btns');
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.style.cssText = 'width:36px;height:36px;border-radius:8px;background:var(--bg3);border:1px solid var(--b2);color:var(--t2);cursor:pointer';
    btn.onclick = () => {
      document.querySelectorAll('#rpe-btns button').forEach(b => b.style.background = 'var(--bg3)');
      btn.style.background = 'var(--g)';
      btn.style.color = '#080c12';
      document.getElementById('log-rpe').value = i;
    };
    rpeContainer.appendChild(btn);
  }
}

function renderClientProgress(container) {
  const myLogs = DB.logs.filter(l => l.clientId === currentUser.clientId).sort((a,b) => b.date.localeCompare(a.date));
  const totalSessions = myLogs.length;
  const avgRpe = myLogs.filter(l => l.rpe).reduce((a,l) => a + l.rpe, 0) / (myLogs.filter(l => l.rpe).length || 1);
  
  container.innerHTML = `
    <div class="flex gap" style="margin-bottom:16px">
      <div class="card" style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--g)">${totalSessions}</div><div style="font-size:11px;color:var(--t3)">Sessions</div></div>
      <div class="card" style="flex:1;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--warn)">${avgRpe.toFixed(1)}</div><div style="font-size:11px;color:var(--t3)">Avg RPE</div></div>
    </div>
    <h3 class="mb">History</h3>
    ${myLogs.length ? myLogs.map(l => `<div class="card"><strong>${l.date}</strong> - ${l.focus || l.type}<br><span class="tag">RPE: ${l.rpe || '—'}</span>${l.notes ? `<div style="font-size:11px;color:var(--t2);margin-top:4px">${l.notes}</div>` : ''}</div>`).join('') : '<div class="empty">No logs yet</div>'}
  `;
}

// ========== MODALES Y ACCIONES ==========
function openAssignModal(date = '') {
  const today = new Date().toISOString().slice(0,10);
  const modalHtml = `
    <div id="custom-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="background:var(--bg2);border-radius:16px;padding:24px;width:100%;max-width:400px">
        <h3 style="margin-bottom:16px">Add to Calendar</h3>
        <div><lbl>Date</lbl><input class="inp" type="date" id="modal-date" value="${date || today}"></div>
        <div class="mt"><lbl>Client</lbl><select class="inp" id="modal-client"><option value="">Select...</option>${DB.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
        <div class="mt"><lbl>Session</lbl><select class="inp" id="modal-session"><option value="">Select...</option>${DB.templates.map(t => `<option value="tpl:${t.id}">Template: ${t.name}</option>`).join('')}${DB.sessions.map(s => `<option value="ses:${s.id}">Session: ${s.name}</option>`).join('')}</select></div>
        <div class="mt"><lbl>Note</lbl><input class="inp" type="text" id="modal-note"></div>
        <div class="flex gap mt"><button class="btn bp" onclick="saveAssignmentModal()">Save</button><button class="btn bg_" onclick="closeModal()">Cancel</button></div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function saveAssignmentModal() {
  const date = document.getElementById('modal-date').value;
  const clientId = document.getElementById('modal-client').value;
  const sessionRef = document.getElementById('modal-session').value;
  const note = document.getElementById('modal-note').value;
  
  if (!date || !clientId || !sessionRef) { toast('Fill all fields'); return; }
  
  let sessionName = 'Session';
  let sessionType = 'Custom';
  if (sessionRef.startsWith('tpl:')) {
    const tpl = DB.templates.find(t => t.id === sessionRef.replace('tpl:', ''));
    if (tpl) { sessionName = tpl.name; sessionType = tpl.type; }
  } else if (sessionRef.startsWith('ses:')) {
    const ses = DB.sessions.find(s => s.id === sessionRef.replace('ses:', ''));
    if (ses) { sessionName = ses.name; sessionType = ses.type || 'Custom'; }
  }
  
  DB.assignments.push({ id: Date.now().toString(), date, clientId, sessionName, sessionType, note });
  saveData();
  closeModal();
  toast('Assigned!');
  if (currentUser.role === 'coach') renderCoachView('calendar');
}

function assignTemplate(templateId) {
  const template = DB.templates.find(t => t.id === templateId);
  if (!template) return;
  const clientName = prompt(`Assign "${template.name}" to which client?\nClients: ${DB.clients.map(c => c.name).join(', ')}`);
  if (!clientName) return;
  const client = DB.clients.find(c => c.name.toLowerCase() === clientName.toLowerCase());
  if (!client) { toast('Client not found'); return; }
  const date = prompt('Date (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
  if (!date) return;
  DB.assignments.push({ id: Date.now().toString(), date, clientId: client.id, sessionName: template.name, sessionType: template.type, note: '' });
  saveData();
  toast(`Assigned to ${client.name}`);
  renderCoachView('calendar');
}

function assignSession(sessionId) {
  const session = DB.sessions.find(s => s.id === sessionId);
  if (!session) return;
  const clientName = prompt(`Assign "${session.name}" to which client?\nClients: ${DB.clients.map(c => c.name).join(', ')}`);
  if (!clientName) return;
  const client = DB.clients.find(c => c.name.toLowerCase() === clientName.toLowerCase());
  if (!client) { toast('Client not found'); return; }
  const date = prompt('Date (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
  if (!date) return;
  DB.assignments.push({ id: Date.now().toString(), date, clientId: client.id, sessionName: session.name, sessionType: session.type || 'Custom', note: '' });
  saveData();
  toast(`Assigned to ${client.name}`);
  renderCoachView('calendar');
}

function createTemplate() {
  const name = prompt('Template name:');
  if (!name) return;
  const type = prompt('Type (finger/strength/endurance/power/technique):', 'strength');
  DB.templates.push({ id: 'tpl_' + Date.now(), name, type: type || 'strength', description: '' });
  saveData();
  renderCoachView('templates');
  toast('Template created');
}

function openAddClientModal() {
  const name = prompt('Client name:');
  if (!name) return;
  const email = prompt('Client email:');
  if (!email) return;
  const target = prompt('Target grade (optional):');
  DB.clients.push({ id: Date.now().toString(), name, email, target: target || '', grade: '' });
  saveData();
  renderCoachView('clients');
  toast(`Client "${name}" added`);
}

function openQuickLog(assignmentId, sessionName, date) {
  const rpe = prompt(`RPE (1-10) for "${sessionName}":`, '5');
  if (!rpe) return;
  const dur = prompt('Duration in minutes:', '60');
  const notes = prompt('Notes (optional):', '');
  DB.logs.push({ id: Date.now().toString(), clientId: currentUser.clientId, date, type: 'Training', focus: sessionName, dur: parseInt(dur) || 60, rpe: parseInt(rpe), notes: notes });
  saveData();
  toast('Session logged!');
  renderClientView('today');
}

function submitClientLog() {
  const sessionId = document.getElementById('log-session').value;
  const assignment = DB.assignments.find(a => a.id === sessionId);
  if (!assignment) { toast('Select a session'); return; }
  const rpe = parseInt(document.getElementById('log-rpe').value) || 0;
  const dur = parseInt(document.getElementById('log-dur').value) || 0;
  const notes = document.getElementById('log-notes').value;
  DB.logs.push({ id: Date.now().toString(), clientId: currentUser.clientId, date: document.getElementById('log-date').value, type: assignment.sessionType || 'Training', focus: assignment.sessionName, dur, rpe, notes });
  saveData();
  toast('Logged!');
  renderClientView('progress');
}

function closeModal() {
  const modal = document.getElementById('custom-modal');
  if (modal) modal.remove();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

window.openAssignModal = openAssignModal;
window.saveAssignmentModal = saveAssignmentModal;
window.assignTemplate = assignTemplate;
window.assignSession = assignSession;
window.createTemplate = createTemplate;
window.openAddClientModal = openAddClientModal;
window.openQuickLog = openQuickLog;
window.submitClientLog = submitClientLog;
window.closeModal = closeModal;

// Inicializar
loadData();
</script>
</body>
</html>
