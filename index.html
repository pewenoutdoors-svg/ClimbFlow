<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0c08">
<title>ClimbFlow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ClimbFlow — Pewen light theme */
  --bg:#f5f0e8;--bg2:#ffffff;--bg3:#f0ebe0;--bg4:#e8e0d0;--bg5:#ddd5c0;
  --g:#4A6741;--g2:#3a5232;--gd:#e8f0e8;
  --t:#1a1208;--t2:#5a4830;--t3:#8a7055;--t4:#b8a080;
  --b:#e0d8c8;--b2:#ccc0a8;--b3:#b8a888;
  --warn:#c96d10;--danger:#c0392b;--info:#4A6741;--purple:#8B1A1A;--teal:#4A6741;
  --r:10px;--rs:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);font-size:14px;line-height:1.5;min-height:600px;}

/* ─── SCREENS ─── */
.screen{display:none}.screen.on{display:block}
#app-screen{display:none;flex-direction:column;min-height:600px}
#app-screen.on{display:flex}

/* ─── LOGIN ─── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:580px;padding:20px}
.login-wrap{width:100%;max-width:360px}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:700;color:var(--g);letter-spacing:.08em;margin-bottom:4px}
.login-tag{font-size:12px;color:var(--t3);margin-bottom:32px;letter-spacing:.06em;text-transform:uppercase}
.login-card{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
lbl{display:block;font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.login-card input{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:var(--rs);padding:10px 13px;color:var(--t);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:14px;transition:.15s}
.login-card input:focus{border-color:var(--g);background:var(--bg4)}
.q-accounts{margin-top:18px;border-top:1px solid var(--b);padding-top:16px}
.q-label{font-size:11px;color:var(--t4);text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em}
.q-pills{display:flex;flex-direction:column;gap:6px}
.qp{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--b);border-radius:8px;padding:8px 12px;cursor:pointer;transition:.12s}
.qp:hover{border-color:var(--g2);background:var(--bg4)}
.qp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.qp-name{font-size:13px;font-weight:500;color:var(--t)}
.qp-email{font-size:11px;color:var(--t3);margin-left:auto}
.qp-role{font-size:10px;padding:1px 7px;border-radius:3px;font-weight:600}

/* ─── TOPBAR ─── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--b);flex-shrink:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:16px;font-weight:700;color:var(--g);letter-spacing:.08em}
.uchip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--b);border-radius:20px;padding:5px 12px 5px 6px;font-size:12px}
.uav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Bebas Neue',sans-serif}
.urole{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:3px}

/* ─── SHELL ─── */
.shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:188px;border-right:1px solid var(--b);background:var(--bg2);padding:14px 0;flex-shrink:0;box-shadow:1px 0 8px rgba(0,0,0,.04)}
.ni{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;color:var(--t3);font-size:13px;font-weight:500;transition:.12s;border-right:2px solid transparent}
.ni:hover{background:var(--bg3);color:var(--t)}
.ni.on{background:var(--gd);color:var(--g);border-right-color:var(--g)}
.ni-client{gap:7px}
.ni-sub{display:flex;align-items:center;gap:9px;padding:7px 18px 7px 38px;cursor:pointer;color:var(--t4);font-size:12px;font-weight:500;transition:.12s;border-right:2px solid transparent}
.ni-sub:hover{background:var(--bg3);color:var(--t2)}
.ni-sub.on{background:var(--gd);color:var(--g);border-right-color:var(--g)}
.ni-sub i{font-size:13px;width:14px;text-align:center}
.ni-group{font-size:10px;color:var(--t4);padding:8px 18px 4px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.ni i{font-size:15px;width:16px;text-align:center}
.sep{height:1px;background:var(--b);margin:8px 12px}
.ni-group{font-size:10px;color:var(--t4);padding:10px 18px 4px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.main{flex:1;overflow-y:auto;padding:20px}
.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px}
.pv{display:none}.pv.on{display:block}

/* ─── BUTTONS ─── */
.btn{padding:8px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.bp{background:var(--g);color:#080c12}.bp:hover{background:var(--g2)}
.bg_{background:transparent;color:var(--t2);border:1px solid var(--b2)}.bg_:hover{background:var(--bg3);color:var(--t)}
.bd{background:transparent;color:var(--danger);border:1px solid var(--danger)}.bd:hover{opacity:.8}
.bsm{padding:5px 11px;font-size:12px}.bxs{padding:3px 8px;font-size:11px;border-radius:4px}

/* ─── CARDS ─── */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ct{font-family:'Bebas Neue',sans-serif;font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.09em}
.fg{display:grid;gap:10px;margin-bottom:10px}
.fg2{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:1fr 1fr 1fr}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--b2);border-radius:var(--rs);padding:8px 10px;color:var(--t);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g2);background:var(--bg4)}
select option{background:var(--bg2)}
textarea{resize:vertical;min-height:52px;line-height:1.5}

/* ─── TAGS ─── */
.tag{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;display:inline-block;white-space:nowrap}
.t-wu{background:#e8f0e8;color:#4A6741}.t-main{background:var(--gd);color:var(--g)}.t-cd{background:#f5ede0;color:var(--warn)}
.t-core{background:#f5e8e8;color:#8B1A1A}.t-ant{background:#e8f0ec;color:#4A6741}.t-finger{background:#fce8e8;color:#c0392b}
.t-strength{background:#e8eff5;color:#2c5f8a}.t-mob{background:#f5f0e0;color:#c96d10}.t-tech{background:#eef5e8;color:#4A6741}
.t-power{background:#fdeee0;color:#c96d10}.t-end{background:#e8f5ee;color:#4A6741}

.ct{font-family:'Bebas Neue',sans-serif;font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.09em}

.fg2{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:1fr 1fr 1fr}

select option{background:var(--bg2)}

.t-main{background:var(--gd);color:var(--g)}
.t-cd{background:#1e1a08;color:var(--warn)}
.t-core{background:#1a0e2e;color:var(--purple)}
.t-ant{background:#0d2020;color:var(--teal)}
.t-finger{background:#200e0e;color:var(--danger)}
.t-strength{background:#0e1a2e;color:var(--info)}
.t-cardio{background:#0e200e;color:var(--g)}
.t-mob{background:#201a0e;color:var(--warn)}
.t-tech{background:#200e18;color:#f472b6}
.t-power{background:#1a0e0e;color:#fb923c}
.t-custom{background:#2a1e35;color:var(--purple)}

/* ─── EXERCISE DB ─── */
.ex-search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.ex-search-bar input{flex:1}
.cat-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cf{font-size:11px;padding:4px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--b2);background:var(--bg3);color:var(--t3);transition:.12s;font-weight:500}
.cf:hover{color:var(--t);border-color:var(--b3)}
.cf.on{background:var(--gd);color:var(--g);border-color:var(--g2)}

.ex-card{background:var(--bg3);border:1px solid var(--b);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;transition:.12s}

.cal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;font-weight:700;color:var(--t)}
.cal-nav{display:flex;gap:6px}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day-header{font-size:10px;font-weight:600;color:var(--t4);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.07em}
.day-cell{background:var(--bg2);border:1px solid var(--b);border-radius:8px;min-height:80px;padding:7px;cursor:pointer;transition:.12s;position:relative}
.day-cell:hover{border-color:var(--b3);background:var(--bg3)}
.day-cell.today{border-color:var(--g);background:var(--gd)}
.day-cell.other-month{opacity:.35}
.day-cell.has-session{border-color:var(--b3)}
.day-num{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px;font-family:'DM Mono',monospace}
.day-cell.today .day-num{color:var(--g)}
.day-sessions{display:flex;flex-direction:column;gap:3px}
.ds-pill{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ds-pill.wu{background:#122030;color:var(--info)}
.ds-pill.main{background:var(--gd);color:var(--g)}
.ds-pill.cd{background:#1e1a08;color:var(--warn)}
.ds-pill.custom{background:#2a1e35;color:var(--purple)}
.ds-pill.rest{background:#1a1a1a;color:var(--t4)}
.day-add{position:absolute;bottom:5px;right:5px;font-size:14px;color:var(--t4);opacity:0;transition:.1s;background:none;border:none;cursor:pointer;font-family:inherit}
.day-cell:hover .day-add{opacity:1;color:var(--g)}

/* ─── WEEK PLAN ─── */

.wp-day-name{font-size:10px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px;font-family:'Bebas Neue',sans-serif}
.wp-session{background:var(--bg3);border-radius:5px;padding:5px 8px;margin-bottom:5px;font-size:11px;border-left:2px solid var(--g);cursor:pointer}
.wp-session:hover{background:var(--bg4)}
.wp-rest{background:var(--bg3);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--t4);text-align:center}
/* ─── CALENDAR VIEW TABS ─── */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.view-tabs{display:flex;gap:3px;background:var(--bg3);border-radius:7px;padding:3px}
.vt-btn{padding:5px 12px;border-radius:5px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;background:transparent;color:var(--t3);transition:.12s}
.vt-btn.on{background:var(--g);color:#080c12}
.ds-pill.template{background:#0a1f30;color:var(--teal)}

/* ─── EFFORT ─── */
.effort-grid{display:flex;flex-direction:column;gap:10px}
.effort-client-row{background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:14px}
.effort-client-name{font-size:13px;font-weight:700;font-family:'Bebas Neue',sans-serif;color:var(--t)}
.effort-bars{display:flex;gap:4px;align-items:flex-end;height:52px;margin-top:8px}
.effort-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.effort-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:.3s}
.effort-bar-label{font-size:9px;color:var(--t4);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;max-width:100%;text-align:center}

/* ─── TEMPLATES ─── */
.template-card{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:10px;transition:.12s}

async function loadData(){
  try{
    const db=window._fbDb;
    if(!db){logs=seedLogs();templates=seedTemplates();return;}
    const {getDocs,collection,query,where}=window._fbFirestore;
    const uid=window._fbUser?.uid||'';
    const userEmail=(currentUser?.email||'').toLowerCase();
    const isC=currentUser?.role==='coach';
    if(isC){
      const snap=await getDocs(query(collection(db,'users'),where('role','==','client')));
      clients=snap.docs.map(d=>({uid:d.id,id:d.id,clientId:d.id,...d.data()}));
    }
    const tSnap=await getDocs(collection(db,'templates'));
    templates=tSnap.docs.map(d=>({id:d.id,...d.data()}));
    if(!templates.length){const st=seedTemplates();for(const t of st){const tid=await fbAdd('templates',t);if(tid)t.id=tid;}templates=st;}
    const csSnap=await getDocs(collection(db,'customSessions'));
    customSessions=csSnap.docs.map(d=>({id:d.id,...d.data()}));
    const logsQ=isC?collection(db,'logs'):query(collection(db,'logs'),where('clientUid','==',uid));
    const lSnap=await getDocs(logsQ);
    logs=lSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(isC){
      const calSnap=await getDocs(collection(db,'calAssigned'));
      calAssigned=calSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    } else {
      const [s1,s2]=await Promise.all([
        getDocs(query(collection(db,'calAssigned'),where('clientUid','==',uid))),
        userEmail?getDocs(query(collection(db,'calAssigned'),where('clientEmail','==',userEmail))):Promise.resolve({docs:[]})
      ]);
      const seen=new Set();calAssigned=[];
      [...s1.docs,...s2.docs].forEach(d=>{if(!seen.has(d.id)){seen.add(d.id);calAssigned.push({id:d.id,...d.data()});}});
      calAssigned.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    }
  }catch(e){console.error('loadData',e);logs=seedLogs();templates=seedTemplates();}
}

async function fbSet(collName, docId, data){
  try{
    const db=window._fbDb;if(!db)return null;
    const {doc,setDoc,serverTimestamp}=window._fbFirestore;
    const ref=doc(db,collName,docId);
    await setDoc(ref,{...data,updatedAt:serverTimestamp()},{merge:true});
    return ref;
  }catch(e){console.error('fbSet',e);return null;}
}
async function fbAdd(collName, data){
  try{
    const db=window._fbDb;if(!db)return null;
    const {collection,addDoc,serverTimestamp}=window._fbFirestore;
    const ref=await addDoc(collection(db,collName),{...data,createdAt:serverTimestamp()});
    return ref.id;
  }catch(e){console.error('fbAdd',e);return null;}
}
async function fbDel(collName, docId){
  try{
    const db=window._fbDb;if(!db)return;
    const {doc,deleteDoc}=window._fbFirestore;
    await deleteDoc(doc(db,collName,docId));
  }catch(e){console.error('fbDel',e);}
}

function setLoginMode(m){
  document.getElementById('mt-login').style.background=m==='login'?'var(--g)':'transparent';
  document.getElementById('mt-login').style.color=m==='login'?'#080c12':'var(--t3)';
  document.getElementById('mt-reg').style.background=m==='register'?'var(--g)':'transparent';
  document.getElementById('mt-reg').style.color=m==='register'?'#080c12':'var(--t3)';
  document.getElementById('login-fields').style.display=m==='login'?'block':'none';
  document.getElementById('register-fields').style.display=m==='register'?'block':'none';
  document.getElementById('login-err').textContent='';
}
function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter email and password';return;}
  const {signInWithEmailAndPassword}=window._fbAuth2;
  signInWithEmailAndPassword(window._fbAuthInst,email,pass)
    .catch(e=>{err.textContent=e.code==='auth/invalid-credential'?'Wrong email or password':e.message;});
}

  try{
    const {createUserWithEmailAndPassword}=window._fbAuth2;
    const cred=await createUserWithEmailAndPassword(window._fbAuthInst,email,pass);
    const {doc,setDoc,serverTimestamp,collection,query,where,getDocs,updateDoc}=window._fbFirestore;
    const db=window._fbDb;
    // Save user profile
    await setDoc(doc(db,'users',cred.user.uid),
      {name,email,grade,target,goal:'',role:'client',createdAt:serverTimestamp()});
    // Link any calAssigned entries the coach created with this email
    try{
      const calQ=query(collection(db,'calAssigned'),where('clientEmail','==',email));
      const calSnap=await getDocs(calQ);
      calSnap.forEach(async calDoc=>{
        await updateDoc(doc(db,'calAssigned',calDoc.id),{clientUid:cred.user.uid});
      });
      // Also delete any pending user entry with this email
      const pendQ=query(collection(db,'users'),where('email','==',email),where('pending','==',true));
      const pendSnap=await getDocs(pendQ);
      const {deleteDoc}=window._fbFirestore;
      pendSnap.forEach(async pd=>{if(pd.id!==cred.user.uid)deleteDoc(doc(db,'users',pd.id));});
    }catch(le){console.log('link error',le);}
    toast('Welcome, '+name+'! 🧗');
  }catch(e){
    err.textContent=e.code==='auth/email-already-in-use'?'Email already registered. Sign in instead.':e.message;
  }
}

function renderCalendar(){
  const el=document.getElementById('pv-cal');

function calViewTabs(){
  return `<div class="view-tabs">
    <button class="vt-btn${calView==='month'?' on':''}" onclick="calView='month';renderCalendar()">Month</button>
    <button class="vt-btn${calView==='week'?' on':''}" onclick="calView='week';renderCalendar()">Week</button>

function renderMonthView(el){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=new Date();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  let cells=[];
  for(let i=firstDay-1;i>=0;i--) cells.push({day:daysInPrev-i,cur:false});
  for(let i=1;i<=daysInMonth;i++) cells.push({day:i,cur:true});
  while(cells.length%7!==0) cells.push({day:cells.length-daysInMonth-firstDay+2,cur:false});
  const getDS=(d)=>`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const getSessions=(d)=>calAssigned.filter(a=>a.date===getDS(d)&&(!sidebarClientFilter||a.client===sidebarClientFilter||a.client===''));
  let html=`<div class="cal-toolbar">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;font-weight:700;color:var(--t)">${months[calMonth]} ${calYear}</div>
    <div class="flex gap ac">
      ${calViewTabs()}
      <button class="btn bg_ bsm" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <button class="btn bg_ bsm" onclick="calNav(0)">Today</button>
      <button class="btn bg_ bsm" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
      <button class="btn bp bsm" onclick="openCalAddModal()"><i class="ti ti-plus"></i> Add</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px">${days.map(d=>`<div class="day-header">${d}</div>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">`;
  cells.forEach(({day,cur})=>{
    const isToday=cur&&day===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
    const dateStr=cur?getDS(day):'';
    const sessions=cur?getSessions(day):[];
    const pills=sessions.slice(0,3).map(s=>{
      const cls=s.sType==='rest'?'rest':s.sType==='template'?'template':s.isCustom?'custom':'main';
      return `<div class="ds-pill ${cls}" onclick="event.stopPropagation();showDayDetail('${dateStr}')">${s.label||'Session'}</div>`;
    }).join('');
    html+=`<div class="day-cell${isToday?' today':''}${!cur?' other-month':''}${sessions.length?' has-session':''}" onclick="cur&&openCalAddModal('${dateStr}')">
      <div class="day-num">${day}</div><div class="day-sessions">${pills}${sessions.length>3?`<div style="font-size:9px;color:var(--t4)">+${sessions.length-3}</div>`:''}</div>
      <button class="day-add" onclick="event.stopPropagation();cur&&openCalAddModal('${dateStr}')">+</button>
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}
function renderWeekView(el){

  const weekStart=new Date(today);weekStart.setDate(today.getDate()-dow);
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      <div class="drop-zone" onclick="openCalAddModal('${ds}')"><i class="ti ti-plus"></i> Add</div>
    </div>`;
  }
  html+=`</div>`;el.innerHTML=html;
}
function renderQuarterView(el){

  let html=`<div class="cal-toolbar">

    </div>
  </div>

        const dotColor=sessions.length?(sessions[0].sType==='rest'?'var(--t4)':sessions[0].sType==='template'?'var(--teal)':'var(--g)'):'transparent';
        return `<div onclick="openCalAddModal('${ds}')" title="${ds}${sessions.length?' — '+sessions.map(s=>s.label).join(', '):''}" style="cursor:pointer;text-align:center;font-size:10px;padding:2px 0;border-radius:3px;background:${isToday?'var(--gd)':'transparent'};color:${isToday?'var(--g)':'var(--t3)'}">
          ${d}${sessions.length?`<div style="width:4px;height:4px;border-radius:50%;background:${dotColor};margin:0 auto"></div>`:'<div style="height:4px"></div>'}
        </div>`;
      }).join('')}
    </div></div>`;
  }
  html+=`</div>`;el.innerHTML=html;
}

function saveCalEntry(){
  const dateVal=document.getElementById('cal-d').value;
  if(!dateVal){toast('Select a date');return;}
  const stype=document.getElementById('cal-stype').value;
  const client=document.getElementById('cal-client').value;
  const labelInput=(document.getElementById('cal-label').value||'').trim();
  const note=document.getElementById('cal-note').value;
  const repeat=parseInt(document.getElementById('cal-repeat').value)||0;
  let session='',tplId='',autoLabel='';
  if(stype==='template'){
    const tplEl=document.getElementById('cal-tpl');
    session=tplEl?tplEl.value:'';
    tplId=session.replace('tpl:','');
    const tpl=templates.find(t=>t.id===tplId);
    autoLabel=tpl?tpl.name:'Template';
  } else if(stype==='custom'){
    const custEl=document.getElementById('cal-custom');
    session=custEl?custEl.value:'';
    const cs=customSessions.find(x=>session.includes(x.id));
    autoLabel=cs?cs.name:'Custom';
  } else {
    session='rest'; autoLabel='Rest';
  }
  const label=labelInput||autoLabel;
  // Parse as local date to avoid UTC offset shifting the day
  const parts=dateVal.split('-').map(Number);
  for(let w=0;w<=repeat;w++){
    const dd=new Date(parts[0],parts[1]-1,parts[2]+w*7);
    const ds=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    calAssigned.push({id:Date.now()+w,date:ds,session,label,note,client,sType:stype,tplId,isCustom:stype==='custom'});
  }
  // Resolve clientUid and clientEmail from clients array
  const selClient=clients.find(c=>c.id===client||c.clientId===client||c.uid===client);
  const resolvedUid=selClient?.uid||selClient?.id||client||'';
  const resolvedEmail=selClient?.email||'';
  // Save to Firebase
  const saves=[];
  const parts2=dateVal.split('-').map(Number);
  for(let w=0;w<=repeat;w++){
    const dd=new Date(parts2[0],parts2[1]-1,parts2[2]+w*7);
    const ds2=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    const entry={date:ds2,session,label,note,client,clientUid:resolvedUid,clientEmail:resolvedEmail,sType:stype,tplId,isCustom:stype==='custom'};
    saves.push(fbAdd('calAssigned',entry).then(id=>{if(id)calAssigned.push({id,...entry});}));
  }
  Promise.all(saves).then(()=>{calAssigned.sort((a,b)=>a.date.localeCompare(b.date));});
  closeModal();renderCalendar();
  toast('Added: '+label+(repeat?' x '+(repeat+1)+' weeks':''));
}

function showDayDetail(dateStr){
  const sessions=calAssigned.filter(a=>a.date===dateStr);
  if(!sessions.length) return;
  showModal(`
    <div class="modal-title"><i class="ti ti-calendar" style="margin-right:8px;color:var(--g)"></i>${dateStr}</div>

/* ══ EFFORT ═════════════════════════════════════ */
// Effort score per log (from effort.js logic)
function calcEffortScore(log){
  const dur=log.dur||0;
  let score= dur<=30?3 : dur<=45?5 : dur<=60?7 : 9;
  const focus=(log.focus||'').toLowerCase()+' '+(log.type||'').toLowerCase();
  if(focus.includes('finger')||focus.includes('power')) score=Math.min(10,score+1);
  return score;
}

const EFFORT_CATS=[
  {key:'endurance',  label:'Endurance',     color:'#4A6741', match:['endurance','arc','pe']},
  {key:'pe',         label:'Power End.',     color:'#E8821A', match:['power end','4x4','20 in 20','circuit']},
  {key:'strength',   label:'Strength',       color:'#7fb3a0', match:['strength','dead hang','hangboard','repeater','campus']},
  {key:'finger',     label:'Finger',         color:'#c0392b', match:['finger','crimp','hang','edge']},
  {key:'technique',  label:'Technique',      color:'#F5E6C8', match:['technique','slab','onsight','route']},
  {key:'conditioning',label:'Conditioning',  color:'#f0c040', match:['conditioning','mobility','antagonist']},
  {key:'outdoor',    label:'Outdoor',        color:'#4A6741', match:['outdoor','sport','trad','bouldering outdoor']},
];

function matchCat(log, cat){
  const haystack=(log.type||'').toLowerCase()+' '+(log.focus||'').toLowerCase();
  return cat.match.some(m=>haystack.includes(m));
}

function renderEffort(){
  const el=document.getElementById('pv-effort');
  const today=new Date();
  // Filter to single client if sidebar filter active
  const filteredClients=sidebarClientFilter?clients.filter(c=>c.id===sidebarClientFilter):clients;
  const clientId=filteredClients[0]?.id;
  if(!clientId){el.innerHTML='<div class="empty">No client selected.</div>';return;}
  const c=filteredClients[0];

  let periods=[];
  if(effortRange==='week'){
    const dow=today.getDay();
    const weekStart=new Date(today);weekStart.setDate(today.getDate()-dow);
    const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);periods.push({label:dayNames[i],ds:dsF(d)});}
  } else if(effortRange==='month'){
    const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
    const firstDow=new Date(calYear,calMonth,1).getDay();
    const weeks=Math.ceil((daysInMonth+firstDow)/7);
    for(let w=0;w<weeks;w++) periods.push({label:`W${w+1}`,week:w});
  } else {
    const qS=Math.floor(calMonth/3)*3;
    const mLabels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    for(let m=0;m<3;m++) periods.push({label:mLabels[qS+m],month:qS+m});
  }

  const getLogsForPeriod=(clientId,period)=>{
    const cl=logs.filter(l=>l.client===clientId);
    if(effortRange==='week') return cl.filter(l=>l.date===period.ds);
    if(effortRange==='month'){
      const firstDow=new Date(calYear,calMonth,1).getDay();
      return cl.filter(l=>{const d=new Date(l.date);return d.getMonth()===calMonth&&d.getFullYear()===calYear&&Math.floor((d.getDate()+firstDow-1)/7)===period.week;});
    }
    return cl.filter(l=>{const d=new Date(l.date);return d.getMonth()===period.month&&d.getFullYear()===calYear;});
  };

  const periodLoads=periods.map(p=>{
    const pLogs=getLogsForPeriod(clientId,p);
    return pLogs.reduce((a,l)=>a+calcEffortScore(l),0);
  });
  const maxLoad=Math.max(...periodLoads,1);
  const clientLogs=logs.filter(l=>l.client===clientId);
  const totalSessions=clientLogs.length;
  const totalLoad=clientLogs.reduce((a,l)=>a+calcEffortScore(l),0);
  const avgRpe=clientLogs.filter(l=>l.rpe).reduce((a,l)=>a+l.rpe,0)/(clientLogs.filter(l=>l.rpe).length||1);

  // Category breakdown
  const catBreakdown=EFFORT_CATS.map(cat=>{
    const catLogs=clientLogs.filter(l=>matchCat(l,cat));
    const catLoad=catLogs.reduce((a,l)=>a+calcEffortScore(l),0);
    return{...cat,load:catLoad,sessions:catLogs.length};
  }).filter(c=>c.sessions>0);
  const maxCatLoad=Math.max(...catBreakdown.map(c=>c.load),1);

  let html=`
  <div class="flex jsb ac" style="margin-bottom:14px">
    <div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;font-weight:700;color:var(--t)">${c.name}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:2px">Training effort overview</div>
    </div>
    <div class="view-tabs">
      <button class="vt-btn${effortRange==='week'?' on':''}" onclick="effortRange='week';renderEffort()">Week</button>
      <button class="vt-btn${effortRange==='month'?' on':''}" onclick="effortRange='month';renderEffort()">Month</button>
      <button class="vt-btn${effortRange==='quarter'?' on':''}" onclick="effortRange='quarter';renderEffort()">Quarter</button>
    </div>
  </div>

  <div class="mg" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    <div class="met"><div class="mv mvc">${totalSessions}</div><div class="ml">Sessions</div></div>
    <div class="met"><div class="mv" style="color:var(--warn)">${totalLoad}</div><div class="ml">Total effort</div></div>
    <div class="met"><div class="mv">${avgRpe.toFixed(1)}</div><div class="ml">Avg RPE</div></div>
  </div>

  <div class="effort-client-row" style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Effort over time</div>
    <div class="effort-bars">
      ${periodLoads.map((load,i)=>{
        const pct=Math.max(4,Math.round((load/maxLoad)*100));
        const col=load===0?'var(--bg4)':load>maxLoad*.75?'var(--danger)':load>maxLoad*.4?'var(--warn)':'var(--g)';
        return `<div class="effort-bar-wrap">
          <div class="effort-bar" style="height:${pct}%;background:${col}" title="${periods[i].label}: effort ${load}"></div>
          <div class="effort-bar-label">${periods[i].label}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  if(catBreakdown.length){
    html+=`<div class="effort-client-row">
      <div style="font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Load by category</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${catBreakdown.sort((a,b)=>b.load-a.load).map(cat=>{
          const pct=Math.round((cat.load/maxCatLoad)*100);
          return `<div>
            <div class="flex jsb ac" style="margin-bottom:4px">
              <span style="font-size:12px;font-weight:500;color:${cat.color}">${cat.label}</span>
              <span style="font-size:11px;color:var(--t3);font-family:'DM Mono',monospace">${cat.load} · ${cat.sessions} session${cat.sessions>1?'s':''}</span>
            </div>
            <div style="height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${cat.color};border-radius:4px;transition:.4s"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  } else {
    html+=`<div class="empty" style="margin-top:10px">No logged sessions yet for category breakdown.</div>`;
  }

  el.innerHTML=html;
}
function dsF(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

    </div>
    <div class="fg fg2">
      <div><lbl>Client</lbl><select id="asgn-client">${clientOpts()}</select></div>
      <div><lbl>Start date</lbl><input type="date" id="asgn-start" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="fg fg2">
      <div><lbl>Sessions/week</lbl><input type="number" id="asgn-freq" value="3" min="1" max="7"></div>
      <div><lbl>Duration</lbl><select id="asgn-dur">
        <option value="full">Full (${totalWeeks} weeks)</option>
        <option value="4">4 weeks (1 month)</option>
        <option value="8">8 weeks (2 months)</option>
        <option value="12">12 weeks (3 months)</option>
        <option value="18">18 weeks</option>
        <option value="24">24 weeks (6 months)</option>
        <option value="36">36 weeks (9 months)</option>
      </select></div>
    </div>
    <div class="fg"><lbl>Training days</lbl>
      <div class="flex gap" style="flex-wrap:wrap;margin-top:4px">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<button type="button" data-day="${i}" onclick="toggleDayPick(this)" class="btn bxs${[1,3,5].includes(i)?' bp day-pick-on':' bg_ day-pick-off'}">${d}</button>`).join('')}
      </div>
    </div>
    <div class="flex gap" style="margin-top:12px">
      <button class="btn bp" onclick="doAssignTemplate('${tplId}')"><i class="ti ti-calendar-event"></i> Generate plan</button>
      <button class="btn bg_" onclick="closeModal()">Cancel</button>
    </div>`);
}
function toggleDayPick(btn){
  const isOn=btn.classList.contains('day-pick-on');
  btn.classList.toggle('day-pick-on',!isOn);
  btn.classList.toggle('day-pick-off',isOn);
  btn.classList.toggle('bp',!isOn);
  btn.classList.toggle('bg_',isOn);
}
function doAssignTemplate(tplId){
  const t=templates.find(x=>x.id===tplId);if(!t)return;
  const clientId=document.getElementById('asgn-client').value;
  const startStr=document.getElementById('asgn-start').value;
  const durVal=document.getElementById('asgn-dur').value;
  const totalWeeks=t.blocks.reduce((a,b)=>a+b.weeks,0);
  const maxWeeks=durVal==='full'?totalWeeks:parseInt(durVal);
  const selectedDays=[...document.querySelectorAll('.day-pick-on[data-day]')].map(b=>parseInt(b.dataset.day)).sort();
  if(!clientId){toast('Select a client');return;}
  if(!startStr){toast('Select a start date');return;}
  if(!selectedDays.length){toast('Select training days');return;}
  // Resolve client uid and email upfront
  const aClient=clients.find(c=>c.id===clientId||c.clientId===clientId||c.uid===clientId);
  const aUid=aClient?.uid||aClient?.id||clientId;
  const aEmail=aClient?.email||'';
  // Build batch — iterate week by week, day by day
  const parts=startStr.split('-').map(Number);
  let curDate=new Date(parts[0],parts[1]-1,parts[2]);
  const blockWeeks=[];
  t.blocks.forEach(b=>{for(let w=0;w<b.weeks;w++) blockWeeks.push(b);});
  const limit=Math.min(maxWeeks,blockWeeks.length);
  const batch=[];
  for(let weekIdx=0;weekIdx<limit;weekIdx++){
    const block=blockWeeks[weekIdx];
    for(let d=0;d<7;d++){
      if(selectedDays.includes(curDate.getDay())){
        const ds=curDate.getFullYear()+'-'+String(curDate.getMonth()+1).padStart(2,'0')+'-'+String(curDate.getDate()).padStart(2,'0');
        batch.push({date:ds,session:'tpl:'+tplId,
          label:block.name.split(' ').slice(0,2).join(' ')+' W'+(weekIdx+1),
          note:'Block: '+block.name,
          client:clientId,clientUid:aUid,clientEmail:aEmail,
          sType:'template',tplId,blockName:block.name});
      }
      curDate.setDate(curDate.getDate()+1);
    }
  }
  if(!batch.length){toast('No sessions generated — check training days');return;}
  // Save to Firebase
  const proms=batch.map(entry=>fbAdd('calAssigned',entry).then(id=>{
    if(id) calAssigned.push({id,...entry});
  }));
  Promise.all(proms).then(()=>{
    calAssigned.sort((a,b)=>a.date.localeCompare(b.date));
    renderCalendar();
  });
  closeModal();
  toast(batch.length+' sessions scheduled for '+(aClient?.name||'client')+'!');
}

function getSessionExercises(entry){
  // Returns {warmup, main, cooldown} from a calAssigned entry
  if(entry.sType==='template'&&entry.tplId){
    const tpl=templates.find(t=>t.id===entry.tplId);
    if(tpl){
      // Determine which block based on label (e.g. "Base Cond W3" → week 3 → block 0)
      const weekMatch=entry.label?.match(/W(\d+)/);
      const weekNum=weekMatch?parseInt(weekMatch[1]):1;
      let cumWeeks=0;
      for(const block of tpl.blocks){
        cumWeeks+=block.weeks;
        if(weekNum<=cumWeeks) return {block,exercises:block.exercises||{warmup:[],main:[],cooldown:[]}};
      }
      const last=tpl.blocks[tpl.blocks.length-1];
      return {block:last,exercises:last?.exercises||{warmup:[],main:[],cooldown:[]}};
    }
  }
  if(entry.sType==='custom'||entry.isCustom){
    const cs=customSessions.find(x=>entry.session?.includes(x.id));
    if(cs) return {block:null,exercises:cs.exercises||{warmup:[],main:[],cooldown:[]}};
  }
  return null;
}

function renderProgram(){
  const el=document.getElementById('pv-program');

    const matchUid=a.clientUid===myId||a.client===myId;

      html+=`<div class="card" style="border-color:${borderColor};opacity:${isPast?'.55':'1'};cursor:pointer;margin-bottom:7px;padding:11px 14px" onclick="programToggle(${i})">
